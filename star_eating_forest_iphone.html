<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>별을 먹는 숲</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e12;color:#e3e8dc;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:manipulation}#game{position:relative;width:min(100vw,56.25vh);height:min(100dvh,177.78vw);max-width:520px;max-height:920px;margin:auto;overflow:hidden;background:#0b1519}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.overlay{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px;background:linear-gradient(#071015c9,#071015f2)}h1{font-size:clamp(30px,8vw,43px);letter-spacing:.12em;margin:0 0 8px;text-shadow:0 0 20px #b1c9a0}.sub{font-size:11px;letter-spacing:.2em;color:#a6b4a6;margin-bottom:28px}.story{max-width:320px;line-height:1.9;font-size:14px;color:#d4d9ce;margin:0 0 25px}button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}.primary{padding:13px 28px;border:1px solid #aebda6;background:#24372e;letter-spacing:.1em;border-radius:3px}.hint{font-size:11px;color:#95a196;line-height:1.7;margin-top:18px}#hud{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;font-size:12px}.pill{padding:7px 9px;background:#071015d9;border:1px solid #40534a}#message{display:none;position:absolute;z-index:3;bottom:158px;left:10px;right:10px;padding:12px;background:#071015f2;border:1px solid #657466;font-size:14px;line-height:1.7}#message strong{color:#d9ca8e}#message small{display:block;text-align:right;color:#a1afa2;margin-top:4px}#controls{display:none;position:absolute;bottom:calc(15px + env(safe-area-inset-bottom));left:0;right:0;padding:0 14px;align-items:end;justify-content:space-between;z-index:2}.pad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:4px}.ctrl{display:flex;align-items:center;justify-content:center;border:1px solid #7d9181aa;background:#14211fe8;border-radius:7px;font-size:19px;user-select:none}.ctrl:active{background:#52654f}.blank{visibility:hidden}.actions{display:flex;flex-direction:column;align-items:center;gap:8px}.act{width:66px;height:50px;background:#2a3d31;border:1px solid #b1c09f;border-radius:50%;font-size:12px}.act2{padding:8px 15px;background:#101b1e;border:1px solid #627369;border-radius:14px;font-size:12px}#toast{display:none;position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:4;white-space:nowrap;background:#081116ed;border:1px solid #607366;padding:8px 10px;font-size:12px}
</style></head><body><div id="game"><canvas id="c" width="360" height="640"></canvas><div id="hud"><div class="pill" id="place">검은 숲</div><div class="pill" id="count">별가루 × 0</div></div><div id="toast"></div><div id="message"></div><div id="controls"><div class="pad"><div class="ctrl blank"></div><button class="ctrl" data-d="up">▲</button><div class="ctrl blank"></div><button class="ctrl" data-d="left">◀</button><div class="ctrl" style="font-size:9px">이동</div><button class="ctrl" data-d="right">▶</button><div class="ctrl blank"></div><button class="ctrl" data-d="down">▼</button><div class="ctrl blank"></div></div><div class="actions"><button class="act" id="inspect">조사</button><button class="act2" id="record">기록</button></div></div><div class="overlay" id="title"><div style="font-size:36px;margin-bottom:14px">✦</div><h1>별을 먹는 숲</h1><div class="sub">A LITTLE DARK FAIRY TALE</div><p class="story">별이 사라진 밤, 숲속에서 누군가 네 이름을 불렀다.<br>손안에 남은 작은 등불 하나.<br>그리고 돌아가는 길을 잊은 발자국.</p><button class="primary" id="start">숲에 들어가기</button><div class="hint">아이폰 터치 조작 가능<br>방향키로 이동하고 반짝이는 것 옆에서 [조사]!</div></div><div class="overlay" id="end" style="display:none"><div style="font-size:35px">☾</div><h1 style="font-size:30px">새벽의 가장자리</h1><p class="story">별가루를 문 앞에 내려놓자 뿌리가 천천히 풀렸다. 숲 바깥에서 새벽빛이 밀려온다. 뒤돌아보니 숲은 아무 일도 없었다는 듯 잠잠하다. 손바닥에는 작은 별 하나가 남아 있었다.</p><button class="primary" onclick="location.reload()">다시 숲으로</button><div class="hint">별을 먹는 숲 · 끝</div></div></div>
<script>
(()=>{const cv=document.getElementById('c'),x=cv.getContext('2d'),T=30,C=12,R=21;const map=["############","#....#.....#","#....#..*..#","#.........##","###.###....#","#...#......#","#.*.#.##...#","#...#......#","#......#...#","##.##..#...#","#....*.#...#","#......#...#","#..####....#","#....#..*..#","#....#.....#","#.........##","###.###....#","#..........#","#....*.....#","#..........#","############"];let p={x:1,y:1},stars=0,started=false,dialog=false,steps=0;const objs=[{x:9,y:2,n:'은빛 나방',s:'나방의 날개에 아주 작은 밤하늘이 비친다. “별은 길을 잃은 게 아니야. 누군가의 소원을 먹고 자란 거지.”',sym:'✧'},{x:2,y:6,n:'잠든 꽃',s:'꽃잎 안쪽에서 별가루가 반짝인다. 손을 대자 따뜻한 빛이 손바닥에 남았다.',sym:'✿',give:1},{x:5,y:10,n:'속삭이는 우물',s:'우물 아래에서 네 목소리가 들린다. “집에 가고 싶어?” 물 위에 별 하나가 떠오른다.',sym:'◉',give:1},{x:8,y:13,n:'뿌리로 된 문',s:'문에는 글자가 새겨져 있다. “돌아가려면, 네가 찾은 빛을 하나 두고 가라.”',sym:'⌑',door:1},{x:5,y:18,n:'길 잃은 별',s:'작고 푸른 별이 땅 위에서 떨고 있다. 별은 네 손안으로 날아와 조용히 빛난다.',sym:'✦',give:1}];function tile(a,b){return map[b]?.[a]||'#'}function center(a,b){return{x:a*T+15,y:b*T+15}}function draw(){x.clearRect(0,0,360,640);let g=x.createLinearGradient(0,0,0,640);g.addColorStop(0,'#14242a');g.addColorStop(1,'#070e12');x.fillStyle=g;x.fillRect(0,0,360,640);for(let i=0;i<55;i++){x.fillStyle=`rgba(201,222,192,${.1+(i%4)*.06})`;x.fillRect((i*73+19)%360,(i*137+31)%640,1.5,1.5)}for(let b=0;b<R;b++)for(let a=0;a<C;a++){let px=a*T,py=b*T;if(tile(a,b)==='#'){x.fillStyle='#17292d';x.fillRect(px,py,30,30);x.fillStyle='#0b171c';x.fillRect(px+5,py+6,20,19);x.strokeStyle='#2c423a';x.beginPath();x.moveTo(px+7,py+2);x.lineTo(px+13,py+14);x.lineTo(px+8,py+26);x.stroke()}else{x.fillStyle=(a+b)%2?'#101d20':'#122125';x.fillRect(px,py,30,30);if((a*3+b*7)%9===0){x.fillStyle='#36503d';x.fillRect(px+7,py+18,2,2)}}}for(let o of objs)if(!o.done){let q=center(o.x,o.y),pulse=.5+.5*Math.sin(Date.now()/320+o.x);x.fillStyle=`rgba(183,217,164,${.08+pulse*.13})`;x.beginPath();x.arc(q.x,q.y,13+pulse*4,0,7);x.fill();x.textAlign='center';x.font='18px serif';x.fillStyle=o.door?'#c6b985':'#c8e4b1';x.fillText(o.sym,q.x,q.y+6)}let q=center(p.x,p.y);x.fillStyle='#0008';x.beginPath();x.ellipse(q.x,q.y+9,8,3,0,0,7);x.fill();x.fillStyle='#b6c4b2';x.fillRect(q.x-5,q.y-8,10,13);x.fillStyle='#d7d4b6';x.fillRect(q.x-4,q.y-14,8,8);x.fillStyle='#293b38';x.fillRect(q.x-3,q.y-12,2,2);x.fillRect(q.x+2,q.y-12,2,2);let v=x.createRadialGradient(180,320,120,180,320,420);v.addColorStop(0,'#0000');v.addColorStop(1,'#020608b8');x.fillStyle=v;x.fillRect(0,0,360,640);if(started)requestAnimationFrame(draw)}function toast(s){let el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',1500)}function say(n,s){let el=document.getElementById('message');el.innerHTML='<strong>'+n+'</strong><br>'+s+'<small>[조사]를 눌러 닫기 ▸</small>';el.style.display='block';dialog=true}function close(){document.getElementById('message').style.display='none';dialog=false}function near(){return objs.find(o=>!o.done&&Math.abs(o.x-p.x)+Math.abs(o.y-p.y)<=1)}function interact(){if(dialog){close();return}let o=near();if(!o){toast('주변에는 오래된 나무뿐이다.');return}if(o.door){if(stars<2){say(o.n,'문이 꿈틀거리며 닫혀 있다. 별가루가 '+(2-stars)+'개 더 필요할 것 같다.');return}document.getElementById('controls').style.display='none';document.getElementById('hud').style.display='none';document.getElementById('end').style.display='flex';return}o.done=true;if(o.give){stars+=o.give;document.getElementById('count').textContent='별가루 × '+stars}say(o.n,o.s)}function move(d){if(!started)return;if(dialog){close();return}let delta={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[d],a=p.x+delta[0],b=p.y+delta[1];if(tile(a,b)==='#')return;p={x:a,y:b};steps++;document.getElementById('place').textContent=p.y>14?'깊은 숲':p.x>7?'속삭이는 숲':'검은 숲';if(steps%9===0)toast('어딘가에서 나뭇잎이 흔들렸다.');draw()}let timer=null;document.querySelectorAll('[data-d]').forEach(btn=>{btn.addEventListener('pointerdown',e=>{e.preventDefault();move(btn.dataset.d);clearInterval(timer);timer=setInterval(()=>move(btn.dataset.d),180)});['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,()=>clearInterval(timer)))});document.getElementById('inspect').onclick=interact;document.getElementById('record').onclick=()=>say('숲의 기록','찾은 별가루: '+stars+'개. 깊은 숲의 뿌리 문은 별가루 두 개가 있어야 열린다.');document.getElementById('start').onclick=()=>{document.getElementById('title').style.display='none';document.getElementById('controls').style.display='flex';started=true;draw();say('검은 숲','낯선 숲이다. 길은 어둡지만 희미한 빛이 몇 군데서 반짝인다. 방향키로 움직이고 가까이 가서 조사해 보자.')};window.addEventListener('keydown',e=>{let d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d)move(d);if(e.key===' '||e.key==='Enter')interact()});document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInterval(timer)});draw()})();
</script></body></html>
